# ---------------------------------------------------------------------------
# Inngangene INN0–INN7 på RaspiPower-kortet (24 V inn, med optokobler). En layout med flere
# faner kan bla mellom dem med bryterne; hva hver inngang gjør, velger du i editoren. Editoren
# bare leser inngangene. enabled = false lar GPIO-ene være i fred (da virker bare knappene i
# editoren).
# ---------------------------------------------------------------------------
[inputs]
enabled = true
# gpio = [16, 26, 20, 21, 19, 13, 12, 6]   # INN0–INN7, fra kortets skjema
# debounce_ms = 30                         # så lenge en bryter må ligge i ro før den teller

# ---------------------------------------------------------------------------
# Egne datakilder, i tillegg til taggene fra huben. Innebygde kilder (CPU-temp,
# minne, IP, klokke ...) finnes alltid. Typer:
#   command – kjører en shell-kommando og bruker utskriften
#   file    – leser en fil (glob-mønster er lov)
#   http    – henter en URL (JSON eller tekst)
# Felles valg:
#   interval = sekunder mellom hver lesing (standard 5)
#   regex    = plukk ut første gruppe fra teksten
#   json     = sti inn i JSON, f.eks. "data.temperature" eller "sensors.0.value"
#   scale / offset = verdi * scale + offset (bare for tall)
#   label / unit   = vises i editoren
# Python-plugins (f.eks. for I2C-sensorer) legges i mappen plugins/.
# ---------------------------------------------------------------------------
[[source]]
name = "wifi_ssid"
label = "WiFi-nettverk"
type = "command"
command = "iwgetid -r"
interval = 30

